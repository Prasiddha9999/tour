
<!DOCTYPE HTML>
<html>
<head>
<title>Package Create</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="package_css.css" rel='stylesheet' type='text/css' />

</head> 
<body>
   <div class="container">
   <!--/inner Content-->
<div class="left-con">
<!--heder end here-->
	<ol class="top-back">
                <li class="top-back-items"><a href="index.html">Home</a>Update Package</li>
            </ol>
		
 	<div class="container">
  	       <h3>Create Package</h3>
  	         <div class="tab-content">
				<form class="forms" name="package" method="post" enctype="multipart/form-data">
					<div class="form-group">
						<label for="focusedinput" class="tit">Package Name</label>
							<div class="input-text">
								<input type="text" class="form-text" name="packagename" id="packagename" placeholder="Create Package" required>
							</div>
					</div>
					<div class="form-group">
						<label for="focusedinput" class="tit">Package Type</label>
							<div class="col-sm-8">
								<input type="text" class="form-text" name="packagetype" id="packagetype" placeholder=" Package Type" required>
							</div>
					</div>

					<div class="form-group">
						<label for="focusedinput" class="tit">Package Location</label>
							<div class="col-sm-8">
								<input type="text" class="form-text" name="packagelocation" id="packagelocation" placeholder=" Package Location" required>
							</div>
					</div>

					<div class="form-group">
						<label for="focusedinput" class="tit">Package Price in NPR</label>
							<div class="col-sm-8">
								<input type="text" class="form-text" name="packageprice" id="packageprice" placeholder=" Package Price is NPR" required>
							</div>
					</div>

					<div class="form-group">
						<label for="focusedinput" class="tit">Package Features</label>
							<div class="col-sm-8">
								<input type="text" class="form-text" name="packagefeatures" id="packagefeatures" placeholder="Package Features" required>
							</div>
					</div>		


					<div class="form-group">
						<label for="focusedinput" class="tit">Package Details</label>
							<div class="col-sm-8">
								<textarea class="form-text" rows="5" cols="50" name="packagedetails" id="packagedetails" placeholder="Package Details" required></textarea> 
							</div>
					</div>		

					<div class="form-group">
						<label for="focusedinput" class="tit">Package Image</label>
							<div class="imgs">
								<input type="file" name="packageimage" id="packageimage" required>
							</div>
					</div>	

					<div class="row">
						<div class="button">
							<button type="submit" name="submit" class="btn-primary btn">Create</button>
						</div>
					</div>			
				</form>
  
	 		</div>

  	
 	</div>
</div>
</div>	


 

</body>
</html>
